# Continuous integration for the HaaS Resource Manager (TD-16).
#
# Runs on every pull request and every push to main. Three jobs run side by
# side so a PR gets feedback in a couple of minutes:
#
#   backend  the PyTest suite with its coverage floor (TD-09, TESTING.md)
#   client   the Vitest suite and a production build of the React client
#   image    builds the deploy image from the Dockerfile and boots it: the
#            same image Render runs (TD-08, DEPLOY.md)
#
# The CD half: render.yaml sets autoDeployTrigger: checksPass, so Render
# deploys a new commit on main only after all three jobs pass.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Same Python as the deploy image (Dockerfile, stage 2).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # Coverage settings, including the fail-under floor, come from
      # server/.coveragerc.
      - name: Run the test suite
        run: python -m pytest --cov --cov-report=term-missing:skip-covered

      - name: Publish coverage to the run summary
        if: always()
        run: |
          {
            echo "### Backend test coverage"
            python -m coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

  client:
    name: Client tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same Node as the deploy image (Dockerfile, stage 1). The client
          # test tooling (jsdom 30) needs Node 22 or newer.
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Deploy image boots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build the image Render deploys
        run: docker build --tag haas-resource-manager:ci .

      # No MONGODB_URI on purpose: the image must boot and serve the client
      # before the database secret exists, the same as a first deploy.
      - name: Start the container
        run: docker run --detach --name app --publish 8000:8000 --env PORT=8000 haas-resource-manager:ci

      - name: Smoke-test the running app
        run: |
          for attempt in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://localhost:8000/healthz && break
            sleep 1
          done

          health=$(curl --silent --fail http://localhost:8000/healthz)
          echo "GET /healthz -> $health"
          [[ "$health" == *'"clientBuilt":true'* ]]

          page=$(curl --silent --fail http://localhost:8000/)
          [[ "$page" == *'<div id="root">'* ]] || { echo "GET / did not serve the React client"; exit 1; }

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://localhost:8000/api/hardware?projectId=P1&userId=alice')
          echo "GET /api/hardware with no database -> $status"
          [[ "$status" == "503" ]]

      - name: Container logs
        if: always()
        run: docker logs app || true
